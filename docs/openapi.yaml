openapi: 3.1.0
info:
  title: ForumX REST API
  version: 1.2.0
  description: Static source-reviewed documentation based on the 2026-10-12 ForumX archive. All routes indexed;
    selected request validation and auth response schemas cross-checked against PHP. Not an end-to-end tested or
    fully exhaustive API contract; generic schemas remain for other responses.
servers:
- url: http://localhost:8080
  description: Local Docker Compose
tags:
- name: Administration
- name: Authentication
- name: Comments
- name: Posts
- name: Reports
- name: Search
- name: Subreddits
- name: Subscriptions
- name: Users
paths:
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Show
      operationId: User_show
      description: 'Implemented by `UserController::show()`; route access level: `guest`. Matching Postman request:
        Get User. Response body is wrapped by Response::success; exact data shape depends on the controller.'
      responses:
        '200':
          description: Successful response (status verified in controller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /api/users:
    put:
      tags:
      - Users
      summary: Update
      operationId: User_update
